<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/styel.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <div
          class="navbar-brand d-flex justify-content-center align-items-center"
        >
          <div class="icon p-2 icon-circ text-white shadow-sm">
            <i class="fas fa-utensils"></i>
          </div>

          <div class="head">
            <h1 class="m-0">What's For Dinner</h1>
            <p class="m-0 text-muted">Your daily meal inspiration</p>
          </div>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul
            class="navbar-nav ms-auto mb-2 mb-lg-0 d-flex justify-content-center align-items-center ul"
          >
            <div class="d-flex icons">
              <li class="nav-item icon-nav">
                <a class="nav-link" href="#"
                  ><i class="fas fa-bookmark fs-20 icon-hover"></i>
                  <span class="d-none">Saved Recipes</span></a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#"
                  ><i class="fas fa-history fs-20 icon-hover"></i>
                  <span class="d-none">Recent</span></a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#"
                  ><i class="fas fa-gear fs-20 icon-hover"></i>
                  <span class="d-none">Settings</span></a
                >
              </li>
            </div>
            <li class="nav-item">
              <a class="nav-link" href="#"
                ><div class="icon-circ border-danger" style="padding: 3px">
                  <img
                    src="assets/avatar-2.jpg"
                    alt="avatar"
                    class="w-100 h-100 rounded-5"
                  />
                </div>
                <span class="d-none pro"> Profile</span></a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <header class="pb-5">
      <div class="container">
        <div
          class="row data bg-white mt-5 rounded-3 shadow-sm"
          style="border-top: 1px solid var(--bg-color)"
        ></div>
      </div>
    </header>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
